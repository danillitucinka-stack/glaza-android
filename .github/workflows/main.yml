name: Build Glaza APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        ndk-version: 25.1.8937393
        accept-licenses: true

    - name: Debug - Show directory structure
      run: |
        echo "=== Project root ==="
        ls -la
        echo ""
        echo "=== Android folder ==="
        ls -la ./android
        echo ""
        echo "=== Android recursive ==="
        find ./android -type f -o -type d | head -50

    - name: Verify Gradle wrapper
      run: |
        if [ ! -f "./android/gradlew" ]; then
          echo "ERROR: ./android/gradlew not found!"
          echo "Expected location: $PWD/android/gradlew"
          echo "Actual files in ./android:"
          ls -la ./android
          exit 1
        fi
        chmod +x ./android/gradlew

    - name: Install dependencies
      run: npm ci
      working-directory: .

    - name: Build Release APK
      run: ./android/gradlew assembleRelease
      working-directory: .

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: glaza-apk
        path: android/app/build/outputs/apk/release/app-release.apk

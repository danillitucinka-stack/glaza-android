name: Build Eye-Pro APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Оновлено до v4

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Оновлено до v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4 # Оновлено до v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4 # Оновлено до v4! Це виправить твою помилку.
        with:
          name: EyePro-Release
          path: android/app/build/outputs/apk/release/*.apk